<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>local-assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════ TOKENS — Tahoe "Liquid Glass" ═══════════ */
:root{
  /* Pure backdrop */
  --bg:#000000;

  /* Glass materials */
  --glass:rgba(20,20,22,.72);
  --glass-thin:rgba(255,255,255,.04);
  --glass-thick:rgba(22,22,24,.88);
  --glass-h:rgba(255,255,255,.08);
  --b0:rgba(255,255,255,.06);
  --b1:rgba(255,255,255,.11);
  --b2:rgba(255,255,255,.20);
  --hl:rgba(255,255,255,.08);
  --shadow:0 24px 60px -12px rgba(0,0,0,.55),0 8px 24px -8px rgba(0,0,0,.45);

  /* Text */
  --t0:#ffffff; --t1:#ececf2; --t2:#a8a8b6; --t3:#76768a; --t4:#48485a;

  /* Accents */
  --ac:#0a84ff;
  --ac2:#5ac8fa;
  --ac-d:rgba(10,132,255,.18);
  --ac-b:rgba(10,132,255,.42);
  --ac-glow:rgba(10,132,255,.38);
  --warm:#ff7a45;
  --warm-d:rgba(255,122,69,.16);

  --usr:var(--ac);
  --asst:rgba(255,255,255,.08);
  --sc:120,170,255;

  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1); --snap:cubic-bezier(.16,1,.3,1); --ease:cubic-bezier(.25,.46,.45,.94);

  --r-window:0;
  --r-pane:14px;
  --r-card:13px;
  --r-pill:999px;
}
html[data-theme="light"]{
  --bg:#ffffff;

  --glass:rgba(248,248,250,.78);
  --glass-thin:rgba(0,0,0,.025);
  --glass-thick:rgba(252,252,253,.92);
  --glass-h:rgba(0,0,0,.05);
  --b0:rgba(0,0,0,.07);
  --b1:rgba(0,0,0,.11);
  --b2:rgba(0,0,0,.20);
  --hl:rgba(255,255,255,.7);
  --shadow:0 24px 60px -16px rgba(0,0,0,.18),0 8px 24px -10px rgba(0,0,0,.10);

  --t0:#0a0a14; --t1:#1c1c28; --t2:#52526a; --t3:#86869a; --t4:#b8b8c4;

  --ac:#0a84ff; --ac2:#5ac8fa;
  --ac-d:rgba(10,132,255,.10);
  --ac-b:rgba(10,132,255,.36);
  --ac-glow:rgba(10,132,255,.22);
  --warm:#ff7a45; --warm-d:rgba(255,122,69,.12);
  --asst:rgba(0,0,0,.04);
  --sc:60,130,240;
}
body[data-state="listening"]{--sc:48,209,88}
body[data-state="recording"]{--sc:255,69,58}
body[data-state="thinking"]{--sc:255,170,10}
body[data-state="speaking"]{--sc:120,170,255}
body[data-state="loading"]{--sc:160,160,200}
body[data-state="warmup"]{--sc:30,200,200}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font);color:var(--t1);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:-.005em;
  background:var(--bg);
  transition:background .25s ease;
}

/* ═══════════ WINDOW ═══════════ */
.shell{
  position:relative;z-index:1;
  width:100%;height:100%;
  background:var(--glass);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:none;
  border-radius:0;
  box-shadow:none;
  display:grid;
  grid-template-columns:248px 1fr 264px;
  grid-template-rows:46px 1fr;
  overflow:hidden;
  transition:grid-template-columns .28s var(--snap);
}
.shell.no-sidebar{grid-template-columns:0 1fr 264px}
.shell.no-inspector{grid-template-columns:248px 1fr 0}
.shell.no-sidebar.no-inspector{grid-template-columns:0 1fr 0}

/* Responsive — collassa l'inspector sotto 900px, la sidebar sotto 640px */
@media (max-width:900px){
  .shell:not(.force-inspector){grid-template-columns:248px 1fr 0}
  .shell:not(.force-inspector) .inspector{border-left-color:transparent;opacity:0;pointer-events:none}
}
@media (max-width:640px){
  .shell:not(.force-sidebar){grid-template-columns:0 1fr 0}
  .shell:not(.force-sidebar) .sidebar{border-right-color:transparent;opacity:0;pointer-events:none}
}

/* ═══════════ TOOLBAR ═══════════ */
.toolbar{
  grid-column:1/-1;grid-row:1;
  display:flex;align-items:center;gap:10px;
  padding:0 12px;
  border-bottom:1px solid var(--b0);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));
  user-select:none;
  min-width:0;
}
html[data-theme="light"] .toolbar{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.18))}
.tb-left{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:0;padding-left:4px}
.tb-center{display:flex;align-items:center;gap:10px;flex:1;justify-content:center;min-width:0}
.tb-right{display:flex;align-items:center;gap:4px;flex-shrink:0}

.tb-icon-sm,.tb-icon{
  width:28px;height:28px;border-radius:8px;border:none;background:transparent;
  color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .14s,color .14s,transform .12s var(--spring);
  -webkit-app-region:no-drag;
}
.tb-icon-sm svg,.tb-icon svg{width:16px;height:16px}
.tb-icon-sm:hover,.tb-icon:hover{background:var(--glass-h);color:var(--t0)}
.tb-icon-sm:active,.tb-icon:active{transform:scale(.88)}
.tb-icon.on{background:var(--ac-d);color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac-b)}

.tb-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 8px 5px 9px;border-radius:var(--r-pill);
  background:var(--glass-thin);border:1px solid var(--b1);color:var(--t1);
  cursor:pointer;font-family:var(--font);font-size:12px;font-weight:500;
  letter-spacing:-.005em;line-height:1;
  box-shadow:inset 0 1px 0 var(--hl);
  transition:background .14s,border-color .14s,transform .12s var(--spring);
  max-width:160px;-webkit-app-region:no-drag;
}
.tb-pill:hover{background:var(--glass-h);border-color:var(--b2)}
.tb-pill:active{transform:scale(.97)}
.tb-pill.on{background:var(--ac-d);border-color:var(--ac-b);color:var(--ac);box-shadow:inset 0 1px 0 var(--hl)}
.tb-pill > svg:first-child{width:13px;height:13px;flex-shrink:0;opacity:.85}
.tb-pill-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11px;max-width:80px}
.tb-pill-caret{width:10px;height:10px;flex-shrink:0;opacity:.6}

.tb-sep{width:1px;height:18px;background:var(--b1);margin:0 4px}

/* Chat title block in center of toolbar */
.tb-title-block{display:flex;flex-direction:column;gap:1px;min-width:0;max-width:240px}
.chat-hd-name{font-size:13px;font-weight:600;color:var(--t0);letter-spacing:-.015em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-hd-status{font-size:11px;color:var(--t2);display:flex;align-items:center;gap:5px;line-height:1.2}
.chat-hd-status .sdot{width:5px;height:5px;border-radius:50%;background:rgba(var(--sc),1);box-shadow:0 0 5px rgba(var(--sc),.7);transition:background .4s}
.chat-hd-orb{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.orb-glow{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,rgba(var(--sc),.95) 0%,rgba(var(--sc),.4) 50%,transparent 75%);
  animation:orb-pulse 3s ease-in-out infinite;transition:background 1s var(--ease);
  filter:saturate(1.2);
}
.orb-ring{
  position:absolute;inset:-2px;border-radius:50%;
  border:1.3px solid rgba(var(--sc),.45);
  animation:orb-rot 8s linear infinite;transition:border-color 1s;
}
.orb-ring::before{
  content:'';position:absolute;top:-2px;left:50%;width:4px;height:4px;border-radius:50%;
  background:rgba(var(--sc),1);box-shadow:0 0 7px 2px rgba(var(--sc),.7);transition:background 1s;
}
.orb-core{
  width:9px;height:9px;border-radius:50%;z-index:1;
  background:rgba(var(--sc),1);box-shadow:0 0 10px rgba(var(--sc),.8);
  transition:background 1s;
}
@keyframes orb-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.85}}
@keyframes orb-rot{from{transform:rotate(0)}to{transform:rotate(360deg)}}
body[data-state="recording"] .orb-glow{animation:orb-pulse .7s ease-in-out infinite}
body[data-state="thinking"] .orb-ring{animation:orb-rot 1.5s linear infinite}
body[data-state="warmup"] .orb-glow{animation:orb-pulse 1.2s ease-in-out infinite}
body[data-state="warmup"] .orb-ring{animation:orb-rot 3s linear infinite}

/* ═══════════ SIDEBAR ═══════════ */
.sidebar{
  grid-column:1;grid-row:2;
  border-right:1px solid var(--b0);
  display:flex;flex-direction:column;overflow:hidden;min-width:0;
  background:rgba(255,255,255,.02);
}
html[data-theme="light"] .sidebar{background:rgba(255,255,255,.28)}
.shell.no-sidebar .sidebar{border-right-color:transparent;opacity:0;pointer-events:none}
.sb-head{
  padding:14px 14px 10px;
  display:flex;flex-direction:column;gap:10px;flex-shrink:0;
}
.sb-title-row{display:flex;align-items:center;gap:10px}
.sb-title{font-size:22px;font-weight:700;color:var(--t0);letter-spacing:-.03em;flex:1;line-height:1}
.sb-search{
  display:flex;align-items:center;gap:7px;
  background:var(--glass-thin);border:1px solid var(--b0);
  border-radius:var(--r-pill);padding:6px 12px;
  box-shadow:inset 0 1px 0 var(--hl);
  transition:border-color .18s,background .18s,box-shadow .18s;
}
.sb-search:focus-within{
  border-color:var(--ac-b);background:var(--glass-h);
  box-shadow:0 0 0 3px var(--ac-d),inset 0 1px 0 var(--hl);
}
.sb-search input{
  flex:1;background:none;border:none;outline:none;
  color:var(--t1);font-family:var(--font);font-size:12.5px;letter-spacing:-.005em;
  min-width:0;
}
.sb-search input::placeholder{color:var(--t3)}
.sb-search svg{width:13px;height:13px;color:var(--t3);flex-shrink:0}

.add-btn{
  width:28px;height:28px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),transparent 55%),
    linear-gradient(140deg,var(--ac2),var(--ac));
  border:none;color:#fff;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px var(--ac-glow),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .15s var(--spring),box-shadow .18s;
}
.add-btn svg{width:14px;height:14px}
.add-btn:hover{transform:scale(1.1) rotate(90deg);box-shadow:0 5px 14px var(--ac-glow),inset 0 1px 0 rgba(255,255,255,.4)}
.add-btn:active{transform:scale(.92)}

.sb-scroll{flex:1;overflow-y:auto;padding:0 8px 8px;min-height:0}
.sb-scroll::-webkit-scrollbar{width:3px}
.sb-scroll::-webkit-scrollbar-thumb{background:var(--b1);border-radius:99px}
.sb-section{
  font-size:10.5px;letter-spacing:0;font-weight:600;
  color:var(--t3);text-transform:uppercase;
  padding:12px 10px 6px;
}

/* Sidebar footer: local-assistant active indicator */
.sb-foot{
  flex-shrink:0;
  border-top:1px solid var(--b0);
  padding:10px 12px;
  display:flex;align-items:center;gap:10px;
  background:var(--glass-thin);
}
.sb-foot .chat-hd-orb{width:28px;height:28px}
.sb-foot .orb-core{width:10px;height:10px}
.sb-foot .tb-title-block{flex:1;min-width:0;max-width:none}
.sb-foot .chat-hd-name{font-size:13px;font-weight:600;color:var(--t0);letter-spacing:-.015em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-foot .chat-hd-status{font-size:11px;color:var(--t2);margin-top:1px;display:flex;align-items:center;gap:5px}

/* TTS toggle inside input — squircle pill */
.itts{
  width:36px;height:36px;border-radius:11px;border:none;flex-shrink:0;
  background:transparent;color:var(--t2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .14s,color .14s,transform .12s var(--spring);
}
.itts svg{width:17px;height:17px}
.itts:hover{background:var(--glass-h);color:var(--t0)}
.itts:active{transform:scale(.88)}
.itts.tts-off{color:var(--t4);position:relative}
.itts.tts-off::after{
  content:"";position:absolute;top:50%;left:50%;width:20px;height:1.7px;
  background:currentColor;transform:translate(-50%,-50%) rotate(-45deg);
  opacity:.9;border-radius:2px;pointer-events:none;
}

/* When TTS is off, dim the voice pill in the toolbar */
.tb-pill.is-disabled{opacity:.4;cursor:not-allowed;pointer-events:auto}
.tb-pill.is-disabled:hover{background:var(--glass-thin);border-color:var(--b1)}

/* Session tabs */
.sess-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--r-card);
  cursor:pointer;border:1px solid transparent;
  transition:background .16s,border-color .16s,transform .12s var(--spring);
  position:relative;margin-bottom:2px;
}
.sess-item:hover{background:var(--glass-h)}
.sess-item.on{
  background:var(--ac-d);
  box-shadow:inset 0 0 0 1px var(--ac-b),inset 0 1px 0 rgba(255,255,255,.08);
}
.sess-item:active{transform:scale(.985)}
.sess-ic{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  border:1px solid var(--b1);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t1);
  position:relative;transition:background .16s,border-color .16s;
}
.sess-item.on .sess-ic{
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  border-color:transparent;color:#fff;
  box-shadow:0 2px 8px var(--ac-glow);
}
.sess-ic-dot{
  position:absolute;bottom:-2px;right:-2px;width:9px;height:9px;border-radius:50%;
  background:#30d158;border:2px solid var(--glass-thick);opacity:0;transition:opacity .3s;
  box-shadow:0 0 4px rgba(48,209,88,.6);
}
.sess-item.on .sess-ic-dot{opacity:1}
.sess-bd{flex:1;min-width:0}
.sess-tp{display:flex;align-items:baseline;gap:8px;padding-right:48px}
.sess-nm{font-size:13px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.015em}
.sess-bt{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:1px}
.sess-pv{font-size:11.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.sess-ct{font-family:var(--mono);font-size:9.5px;color:var(--t3);flex-shrink:0}
.sess-acts{
  position:absolute;top:6px;right:6px;display:flex;gap:3px;
  opacity:0;transition:opacity .15s;
}
.sess-item:hover .sess-acts{opacity:1}
.sess-act{
  width:20px;height:20px;border-radius:6px;
  background:var(--glass-thin);border:1px solid var(--b1);color:var(--t2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s,border-color .12s,transform .12s var(--spring);
}
.sess-act svg{width:11px;height:11px}
.sess-act:active{transform:scale(.85)}
.sess-ren:hover{background:var(--ac-d);color:var(--ac);border-color:var(--ac-b)}
.sess-del:hover{background:rgba(255,69,58,.18);color:#ff453a;border-color:rgba(255,69,58,.4)}
.sess-rename-input{
  width:100%;background:var(--glass-thick);border:1px solid var(--ac-b);
  border-radius:6px;padding:2px 6px;
  color:var(--t0);font-family:var(--font);font-size:13px;font-weight:600;
  outline:none;box-shadow:0 0 0 3px var(--ac-d);
}

/* ═══════════ INSPECTOR (right pane) ═══════════ */
.inspector{
  grid-column:3;grid-row:2;
  border-left:1px solid var(--b0);
  background:rgba(255,255,255,.02);
  display:flex;flex-direction:column;overflow:hidden;min-width:0;
}
html[data-theme="light"] .inspector{background:rgba(255,255,255,.28)}
.shell.no-inspector .inspector{border-left-color:transparent;opacity:0;pointer-events:none}
.insp-scroll{
  flex:1;overflow-y:auto;padding:14px 14px 18px;
  display:flex;flex-direction:column;
}
.insp-scroll::-webkit-scrollbar{width:3px}
.insp-scroll::-webkit-scrollbar-thumb{background:var(--b1);border-radius:99px}
.insp-section-head{
  font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:uppercase;
  color:var(--t3);
  padding:14px 4px 7px;
}
.insp-section-head:first-child{padding-top:2px}

.insp-card{
  background:var(--glass-thin);border:1px solid var(--b0);border-radius:12px;
  padding:4px 0;box-shadow:inset 0 1px 0 var(--hl);
  overflow:hidden;
}
.insp-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;font-size:12.5px;color:var(--t1);letter-spacing:-.005em;
  border-bottom:1px solid var(--b0);
  background:transparent;width:100%;
  border-top:none;border-left:none;border-right:none;
}
.insp-row:last-child{border-bottom:none}
.insp-row-k{color:var(--t2);font-weight:500}
.insp-row-v{display:flex;align-items:center;gap:6px;color:var(--t1);font-family:var(--mono);font-size:11.5px}
.insp-row-btn{cursor:pointer;font-family:var(--font);text-align:left;
  transition:background .14s;
}
.insp-row-btn:hover{background:var(--glass-h)}
.insp-row-btn:active{background:var(--ac-d)}
.insp-state-dot{
  width:8px;height:8px;border-radius:50%;background:rgba(var(--sc),1);
  box-shadow:0 0 6px rgba(var(--sc),.65);transition:background .4s;
}
.conn-dot{
  display:inline-block;font-size:12px;color:#30d158;line-height:1;
  filter:drop-shadow(0 0 4px rgba(48,209,88,.55));
}
kbd{
  font-family:var(--mono);font-size:10px;font-weight:600;
  background:var(--glass-thick);color:var(--t0);
  border:1px solid var(--b2);border-radius:5px;
  padding:2px 6px;letter-spacing:.04em;line-height:1;
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.15),inset 0 1px 0 var(--hl);
}

/* Stat mini-cards */
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mstat{
  background:var(--glass-thin);border:1px solid var(--b0);border-radius:11px;
  padding:9px 11px;display:flex;flex-direction:column;gap:2px;
  box-shadow:inset 0 1px 0 var(--hl);
}
.mstat-k{font-size:10px;font-weight:500;color:var(--t3);letter-spacing:-.005em}
.mstat-v{font-size:18px;font-weight:600;color:var(--t1);line-height:1;letter-spacing:-.02em;font-family:var(--font);font-variant-numeric:tabular-nums}

/* Latency */
.lat-box{background:var(--glass-thin);border:1px solid var(--b0);border-radius:12px;padding:11px;box-shadow:inset 0 1px 0 var(--hl)}
.lat-r{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.lat-r:last-child{margin-bottom:0}
.lat-nm{font-family:var(--mono);font-size:9.5px;color:var(--t2);width:28px;flex-shrink:0;font-weight:500}
.lat-tk{flex:1;height:4px;background:var(--b0);border-radius:99px;overflow:hidden}
.lat-bb{height:100%;border-radius:99px;width:0%;transition:width .6s var(--snap)}
.lat-bb.s1{background:#30d158}
.lat-bb.s2{background:var(--ac)}
.lat-bb.s3{background:var(--warm)}
.lat-vl{font-family:var(--mono);font-size:9.5px;color:var(--t2);width:38px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

/* ═══════════ CONTENT (messages + input) ═══════════ */
.content{
  grid-column:2;grid-row:2;
  display:flex;flex-direction:column;overflow:hidden;
  background:transparent;min-width:0;
}

/* Messages */
.msgs{
  flex:1;overflow-y:auto;padding:24px 32px 8px;
  display:flex;flex-direction:column;gap:4px;
}
.msgs::-webkit-scrollbar{width:3px}
.msgs::-webkit-scrollbar-thumb{background:var(--b1);border-radius:99px}

.date-chip{
  align-self:center;font-family:var(--mono);font-size:10.5px;color:var(--t2);

}

.empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;opacity:.4;pointer-events:none;user-select:none;
}
.empty-ic{
  width:64px;height:64px;border-radius:18px;
  background:linear-gradient(140deg,var(--ac2),var(--ac));
  display:flex;align-items:center;justify-content:center;
  font-size:30px;color:#fff;font-weight:600;
  box-shadow:0 8px 32px var(--ac-glow),inset 0 1px 0 rgba(255,255,255,.4);
  animation:efloat 4s ease-in-out infinite;
}
@keyframes efloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.empty-tx{font-size:13px;color:var(--t2);text-align:center;line-height:1.7}

.mrow{display:flex;gap:10px;padding:4px 0;opacity:1}
@keyframes mrow-in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.mrow.fresh{animation:mrow-in .28s var(--snap)}
.mrow.u{justify-content:flex-end}
.mrow.a{justify-content:flex-start}

.mav{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;margin-top:auto;
  background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  border:1px solid var(--b1);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t1);
  box-shadow:inset 0 1px 0 var(--hl);
}
.mrow.u .mav{
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  border-color:transparent;color:#fff;
  box-shadow:0 2px 8px var(--ac-glow);
}

.mwrap{max-width:min(560px,70%);display:flex;flex-direction:column;gap:4px}
.mrow.u .mwrap{align-items:flex-end}

.mbubble{
  position:relative;padding:10px 15px;font-size:14px;line-height:1.55;font-weight:400;
  word-break:break-word;letter-spacing:-.005em;
}
.mrow.a .mbubble{
  background:var(--asst);color:var(--t1);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:6px 18px 18px 18px;
  border:1px solid var(--b0);
  box-shadow:inset 0 1px 0 var(--hl);
}
.mrow.u .mbubble{
  background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;
  border-radius:18px 6px 18px 18px;
  box-shadow:0 6px 20px var(--ac-glow),inset 0 1px 0 rgba(255,255,255,.25);
}
.mbody-txt{display:block;white-space:pre-wrap;position:relative;z-index:1}
.streaming .mbody-txt::after{
  content:'';display:inline-block;width:6px;height:14px;
  background:currentColor;opacity:.7;vertical-align:-2px;
  margin-left:2px;border-radius:1px;
  animation:bk .9s ease-in-out infinite;
}
@keyframes bk{0%,100%{opacity:.7}50%{opacity:0}}

.mtime{
  font-family:var(--mono);font-size:9.5px;color:var(--t3);
  padding:0 6px;display:flex;align-items:center;gap:5px;
}
.mrow.u .mtime{flex-direction:row-reverse}
.mtick{color:#30d158;font-size:11px}

.copy-btn{
  position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:7px;
  background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.85);font-size:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s,background .12s,transform .12s var(--spring);z-index:2;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.mrow.a .copy-btn{background:var(--glass-thin);border-color:var(--b1);color:var(--t2)}
.mrow:hover .copy-btn{opacity:1}
.copy-btn:hover{transform:scale(1.12)}
.copy-btn:active{transform:scale(.85)}
.copy-btn.ok{opacity:1;color:#30d158}
body.sel-open .copy-btn{pointer-events:none!important;opacity:0!important}

/* Input — Tahoe Liquid Glass capsule */
.input-zone{flex-shrink:0;padding:10px 22px 18px}
.ibar{
  display:flex;align-items:center;gap:6px;
  background:var(--glass-thick);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--b1);
  border-radius:24px;padding:6px;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.35),inset 0 1px 0 var(--hl);
  transition:border-color .2s,box-shadow .2s;
}
.ibar:focus-within{
  border-color:var(--ac-b);
  box-shadow:0 12px 30px -8px rgba(0,0,0,.35),0 0 0 4px var(--ac-d),inset 0 1px 0 var(--hl);
}
.iattach{
  width:36px;height:36px;border-radius:11px;border:none;
  background:transparent;color:var(--t2);cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:background .14s,color .14s,transform .12s var(--spring);
}
.iattach svg{width:16px;height:16px}
.iattach:hover{background:var(--glass-h);color:var(--t0)}
.iattach:active{transform:scale(.88)}
.iattach.busy{opacity:.5;cursor:wait}

/* Upload chips */
.attach-row{
  display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 6px;
  max-height:0;overflow:hidden;transition:max-height .2s var(--snap);
}
.attach-row.on{max-height:140px;padding-bottom:8px}
.attach-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--glass-thick);border:1px solid var(--b1);border-radius:11px;
  padding:5px 8px 5px 10px;font-size:12px;color:var(--t2);max-width:240px;
  box-shadow:inset 0 1px 0 var(--hl);
  animation:mrow-in .2s var(--snap);
}
.attach-chip-ic{font-size:14px;flex-shrink:0}
.attach-chip-nm{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
  font-family:var(--mono);font-size:11px;color:var(--t1);
}
.attach-chip-sz{font-family:var(--mono);font-size:10px;color:var(--t3);flex-shrink:0}
.attach-chip-rm{
  width:18px;height:18px;border:none;background:transparent;color:var(--t2);
  cursor:pointer;font-size:14px;line-height:1;padding:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .12s,color .12s;
}
.attach-chip-rm:hover{background:rgba(255,69,58,.18);color:#ff453a}

/* Drop overlay */
.drop-ov{
  display:none;position:fixed;inset:0;z-index:9999;pointer-events:none;
  background:rgba(0,0,0,.4);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
}
.drop-ov.on{display:flex;align-items:center;justify-content:center}
.drop-bx{
  background:var(--glass-thick);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:2px dashed var(--ac);border-radius:24px;
  padding:42px 60px;display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 var(--hl);
  animation:mrow-in .25s var(--snap);
}
.drop-ic{font-size:42px;animation:efloat 2.5s ease-in-out infinite}
.drop-tx{font-size:15px;font-weight:600;color:var(--t0);letter-spacing:-.01em}
.drop-sub{font-size:11.5px;color:var(--t2);font-family:var(--mono)}

.itxt{
  flex:1;background:none;border:none;outline:none;
  color:var(--t1);font-family:var(--font);font-size:14px;font-weight:400;
  line-height:1.5;resize:none;max-height:110px;min-height:22px;padding:7px 6px;
  letter-spacing:-.005em;
}
.itxt::placeholder{color:var(--t3)}
.wrec{display:flex;align-items:center;gap:2px;height:18px;opacity:0;transition:opacity .2s;flex-shrink:0;padding:0 6px}
.wrec.on{opacity:1}
.wr{width:3px;border-radius:99px;background:#ff453a;animation:wv .5s ease-in-out infinite}
.wr:nth-child(1){height:5px}.wr:nth-child(2){height:10px;animation-delay:.08s}.wr:nth-child(3){height:16px;animation-delay:.16s}.wr:nth-child(4){height:10px;animation-delay:.08s}.wr:nth-child(5){height:5px}
@keyframes wv{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.2)}}
.imic{
  width:36px;height:36px;border-radius:11px;flex-shrink:0;
  background:transparent;border:none;color:var(--t2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .14s,color .14s,transform .12s var(--spring);
}
.imic[hidden]{display:none}
.imic svg{width:16px;height:16px}
.imic:hover{background:var(--glass-h);color:var(--t0)}
.imic.cap{background:rgba(255,170,10,.16);color:#ffaa0a;animation:capr 1s ease-in-out infinite}
@keyframes capr{0%,100%{box-shadow:0 0 0 0 rgba(255,170,10,0)}50%{box-shadow:0 0 0 4px rgba(255,170,10,.2)}}
.isend{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),transparent 55%),
    linear-gradient(140deg,var(--ac2),var(--ac));
  border:none;color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px var(--ac-glow),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .12s var(--spring),box-shadow .15s,opacity .15s;
}
.isend:hover{transform:scale(1.08);box-shadow:0 6px 18px var(--ac-glow),inset 0 1px 0 rgba(255,255,255,.4)}
.isend:active{transform:scale(.9)}
.isend:disabled{opacity:.3;cursor:default;transform:none;box-shadow:none}
.isend svg{width:15px;height:15px}

/* Stop button — sostituisce .isend mentre l'assistente elabora/parla */
.istop{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.22),transparent 55%),
    linear-gradient(140deg,#3a3a44,#15151a);
  border:none;color:#fff;cursor:pointer;position:relative;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .12s var(--spring),box-shadow .15s,background .2s;
}
html[data-theme="light"] .istop{
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),transparent 55%),
    linear-gradient(140deg,#3c3c46,#1d1d24);
}
.istop:hover{transform:scale(1.08);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22)}
.istop:active{transform:scale(.88)}
.istop svg{width:11px;height:11px;position:relative;z-index:1}
.istop::before{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid rgba(var(--sc),.55);
  animation:stop-ring 1.4s ease-out infinite;pointer-events:none;
}
.istop::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  box-shadow:0 0 0 0 rgba(var(--sc),.35);
  animation:stop-pulse 1.4s ease-out infinite;pointer-events:none;
}
@keyframes stop-ring{
  0%{transform:scale(.92);opacity:.65;border-color:rgba(var(--sc),.7)}
  100%{transform:scale(1.35);opacity:0;border-color:rgba(var(--sc),.1)}
}
@keyframes stop-pulse{
  0%{box-shadow:0 0 0 0 rgba(var(--sc),.4)}
  100%{box-shadow:0 0 0 10px rgba(var(--sc),0)}
}
/* Swap send ⇄ stop in base allo stato del corpo */
body[data-state="thinking"] .isend,
body[data-state="speaking"] .isend{display:none}
body[data-state="thinking"] .istop,
body[data-state="speaking"] .istop{display:flex}
/* Il toggle TTS resta attivo durante elaborazione/parlato: mutarlo mentre
   l'assistente parla zittisce subito la voce senza fermare il testo. */

/* Selector dropdown */
.sel-panel{
  position:fixed;min-width:230px;max-height:320px;overflow-y:auto;
  background:var(--glass-thick);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--b2);border-radius:14px;
  box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 var(--hl);
  z-index:9999;display:none;padding:6px;
  animation:pin .18s var(--snap);
}
@keyframes pin{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
.sel-panel::-webkit-scrollbar{width:3px}
.sel-panel::-webkit-scrollbar-thumb{background:var(--b2);border-radius:99px}
.sel-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer;transition:background .12s;user-select:none}
.sel-item:hover,.sel-item.active{background:var(--ac-d)}
.sel-item.active{color:var(--ac)}
.sel-item-ic{width:26px;height:26px;border-radius:7px;background:var(--glass-thin);border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.sel-item-bd{flex:1;min-width:0}
.sel-item-nm{font-size:13px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.sel-item.active .sel-item-nm{color:var(--ac);font-weight:600}
.sel-item-sb{font-family:var(--mono);font-size:10px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.sel-item-ck{font-size:12px;color:var(--ac);opacity:0;flex-shrink:0;font-weight:700}
.sel-item.active .sel-item-ck{opacity:1}
.sel-sec{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--t3);padding:8px 9px 3px}

/* Command palette */
.pal-ov{display:none;position:fixed;inset:0;z-index:10000;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(14px) saturate(180%);
  -webkit-backdrop-filter:blur(14px) saturate(180%);
  align-items:flex-start;justify-content:center;padding-top:14vh}
.pal-ov.open{display:flex;animation:pf .14s var(--ease)}
@keyframes pf{from{opacity:0}to{opacity:1}}
.pal-bx{
  width:min(560px,90vw);
  background:var(--glass-thick);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--b2);border-radius:18px;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.65),inset 0 1px 0 var(--hl);
  animation:pin .2s var(--snap);
}
.pal-tp{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--b1)}
.pal-ic{font-size:14px;color:var(--t2)}
.pal-in{flex:1;background:none;border:none;outline:none;color:var(--t1);font-family:var(--font);font-size:14px;letter-spacing:-.005em}
.pal-in::placeholder{color:var(--t3)}
.pal-rs{max-height:340px;overflow-y:auto;padding:6px}
.pal-rs::-webkit-scrollbar{width:3px}
.pal-rs::-webkit-scrollbar-thumb{background:var(--b2);border-radius:99px}
.pit{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;transition:background .12s}
.pit:hover,.pit.sel{background:var(--ac-d)}
.pit.sel{color:var(--ac)}
.pit-ic{width:26px;height:26px;border-radius:7px;background:var(--glass-thin);border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.pit-lb{font-size:13px;color:var(--t1);letter-spacing:-.005em}
.pit.sel .pit-lb{color:var(--ac);font-weight:600}
.pit-sb{font-family:var(--mono);font-size:10px;color:var(--t3);margin-left:auto;flex-shrink:0;background:var(--glass-thin);padding:2px 6px;border-radius:5px;border:1px solid var(--b0)}
.pit-sc{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--t3);padding:8px 10px 3px}

/* Toast */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(8px);
  padding:9px 18px;border-radius:var(--r-pill);
  background:var(--glass-thick);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--b2);
  box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 1px 0 var(--hl);
  font-size:12.5px;color:var(--t0);font-weight:500;opacity:0;letter-spacing:-.005em;
  transition:opacity .2s,transform .2s var(--snap);z-index:10001;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<script>
const $=id=>document.getElementById(id);
const msgs=$('msgs'),emptyEl=$('empty'),itxt=$('itxt'),isend=$('isend');

const stT=$('st-t'),stW=$('st-w'),stSe=$('st-se'),stTe=$('st-te');
const lb1=$('lb1'),lb2=$('lb2'),lb3=$('lb3'),lv1=$('lv1'),lv2=$('lv2'),lv3=$('lv3');
const modelCur=$('model-cur'),persCur=$('pers-cur');
const voiceCur=$('voice-cur'),pttCur=$('ptt-cur');
const palette=$('palette'),palIn=$('pal-in'),palRs=$('pal-rs');

let ws=null,reconn=null,pingTimer=null,capPTT=false,curRow=null,streamTxt='';
// Vero tra il click su "stop" e l'inizio del turno successivo: scarta i
// chunk LLM ancora in arrivo dal backend così non rinasce una bolla.
let genStopped=false;
let personalities=[],activePers=null,models=[],activeModel=null,voices=[],activeVoice=null,ttsEnabled=true;
let isDark=true,palOpen=false,palSel=0;
const hist=[];

const STL={idle:'inattivo',loading:'caricamento…',listening:'in ascolto',recording:'registrazione',thinking:'elaborazione',speaking:'risposta',warmup:'riscaldamento…'};
const PEM=['🤖','💻','✨','🎭','🧠','🌟'];

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const scrollBot=()=>msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'});
const autoR=()=>{itxt.style.height='auto';itxt.style.height=Math.min(itxt.scrollHeight,110)+'px'};
const ms2s=ms=>ms<1000?ms+'ms':(ms/1000).toFixed(1)+'s';
const now=()=>new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
function showToast(m,d=2000){toast.textContent=m;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),d)}

/* Theme */
const THEME_ICONS={
  dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>',
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>'
};
function setTheme(d){isDark=d;document.documentElement.dataset.theme=d?'dark':'light';$('rb-theme').innerHTML=d?THEME_ICONS.dark:THEME_ICONS.light;try{localStorage.setItem('la-theme',d?'dark':'light')}catch(e){}}
$('rb-theme').addEventListener('click',()=>setTheme(!isDark));
try{if(localStorage.getItem('la-theme')==='light')setTheme(false)}catch(e){}

/* Sidebar & Inspector toggles */
const shellEl=document.querySelector('.shell');
function loadPaneState(){
  try{
    if(localStorage.getItem('la-sidebar')==='off')shellEl.classList.add('no-sidebar');
    if(localStorage.getItem('la-inspector')==='off')shellEl.classList.add('no-inspector');
  }catch(e){}
  syncPaneToggles();
}
function syncPaneToggles(){
  $('tb-sidebar-toggle').classList.toggle('on',!shellEl.classList.contains('no-sidebar'));
  $('tb-inspector-toggle').classList.toggle('on',!shellEl.classList.contains('no-inspector'));
}
$('tb-sidebar-toggle').addEventListener('click',()=>{
  shellEl.classList.toggle('no-sidebar');

  syncPaneToggles();
});
$('tb-inspector-toggle').addEventListener('click',()=>{
  shellEl.classList.toggle('no-inspector');
  try{localStorage.setItem('la-inspector',shellEl.classList.contains('no-inspector')?'off':'on')}catch(e){}
  syncPaneToggles();
});
loadPaneState();

/* Mode switch — verso il terminale */
$('rb-term').addEventListener('click',async()=>{
  try{
    await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'terminal'})});
    window.location='/terminal';
  }catch(e){showToast('Impossibile passare al terminale')}
});

/* State */
function applyState(s){
  document.body.dataset.state=s;
  hdStatus.textContent=STL[s]||s;
  const ins=$('insp-state');if(ins)ins.textContent=STL[s]||s;
  wrec.classList.toggle('on',s==='recording');
}
function updStats(d){
  if(d.turns!=null)stT.textContent=d.turns;
  if(d.words_in!=null||d.words_out!=null)stW.textContent=(d.words_in||0)+'/'+(d.words_out||0);
  if(d.stt_errors!=null)stSe.textContent=d.stt_errors;
  if(d.tts_errors!=null)stTe.textContent=d.tts_errors;
}
function updLat(d){
  if(!d)return;const MAX=6000;
  const set=(b,v,ms)=>{if(ms==null)return;b.style.width=Math.max(2,Math.min(100,(ms/MAX)*100))+'%';v.textContent=ms2s(ms)};
  set(lb1,lv1,d.stt_ms);set(lb2,lv2,d.llm_ms);set(lb3,lv3,d.tts_ms);
}

/* ── Dropdown system (body-level, no stacking issues) ── */
const _panels=new Map();let _openSel=null;
function _getPanel(sel){if(!_panels.has(sel)){const p=document.createElement('div');p.className='sel-panel';document.body.appendChild(p);_panels.set(sel,p)}return _panels.get(sel)}
function _posPanel(sel){
  const r=sel.getBoundingClientRect(),p=_getPanel(sel);
  p.style.visibility='hidden';p.style.display='block';
  // Default: drop down below the trigger, aligned to its right edge (toolbar pills)
  p.style.top=(r.bottom+6)+'px';
  p.style.left=(r.left)+'px';
  requestAnimationFrame(()=>{
    const pw=p.offsetWidth,ph=p.offsetHeight,ww=window.innerWidth,wh=window.innerHeight;
    // Flip horizontally if it would overflow right edge
    if(r.left+pw>ww-8)p.style.left=Math.max(8,r.right-pw)+'px';
    // Flip vertically if it would overflow bottom — show above instead
    if(r.bottom+6+ph>wh-8)p.style.top=Math.max(8,r.top-ph-6)+'px';
    p.style.visibility='';
  });
}
function closeSel(){if(_openSel){_openSel.classList.remove('on');const p=_panels.get(_openSel);if(p){p.style.display='none';p.style.visibility=''}_openSel=null}document.body.classList.remove('sel-open')}
function toggleSel(sel){if(_openSel===sel){closeSel();return}closeSel();sel.classList.add('on');_openSel=sel;document.body.classList.add('sel-open');_posPanel(sel)}
document.addEventListener('click',e=>{if(!e.target.closest('.tb-pill')&&!e.target.closest('.sel-panel'))closeSel()});

/* Model */
function renderModels(){const P=_getPanel($('sel-model'));P.innerHTML='';models.forEach(m=>{const it=document.createElement('div');it.className='sel-item'+(m===activeModel?' active':'');it.innerHTML=`<div class="sel-item-ic">🧠</div><div class="sel-item-bd"><div class="sel-item-nm">${esc(m)}</div></div><div class="sel-item-ck">✓</div>`;it.addEventListener('click',ev=>{ev.stopPropagation();closeSel();switchModel(m)});P.appendChild(it)})}
function setActiveModel(n){activeModel=n;modelCur.textContent=n.split(':')[0];const p=_panels.get($('sel-model'));if(p)p.querySelectorAll('.sel-item').forEach(el=>el.classList.toggle('active',el.querySelector('.sel-item-nm')?.textContent===n))}
async function switchModel(n){if(n===activeModel)return;try{const r=await fetch('/api/model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});if(r.ok){setActiveModel(n);showToast('Modello: '+n.split(':')[0])}}catch(e){console.warn(e)}}
async function loadModels(){try{const r=await fetch('/api/models');const d=await r.json();models=d.models||[];if(d.active)setActiveModel(d.active);renderModels()}catch(e){console.warn(e)}}
$('sel-model').addEventListener('click',e=>{e.stopPropagation();toggleSel($('sel-model'))});

/* Personality */
function renderPers(){const P=_getPanel($('sel-pers'));P.innerHTML='';personalities.forEach((p,i)=>{const it=document.createElement('div');it.className='sel-item'+(p.name===activePers?' active':'');it.dataset.name=p.name;it.innerHTML=`<div class="sel-item-ic">${PEM[i%PEM.length]}</div><div class="sel-item-bd"><div class="sel-item-nm">${esc(p.display_name||p.name)}</div><div class="sel-item-sb">${esc(p.description||'')}</div></div><div class="sel-item-ck">✓</div>`;it.addEventListener('click',ev=>{ev.stopPropagation();closeSel();switchPers(p.name)});P.appendChild(it)})}
function setActivePers(n){activePers=n;const p=personalities.find(x=>x.name===n);persCur.textContent=p?p.display_name||n:n;const pp=_panels.get($('sel-pers'));if(pp)pp.querySelectorAll('.sel-item').forEach(el=>el.classList.toggle('active',el.dataset.name===n))}
async function switchPers(n){if(n===activePers)return;try{const r=await fetch('/api/personality',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});if(r.ok){setActivePers(n);showToast('Personalità: '+n)}}catch(e){console.warn(e)}}
$('sel-pers').addEventListener('click',e=>{e.stopPropagation();toggleSel($('sel-pers'))});

/* Voice */
function renderVoices(){const P=_getPanel($('sel-voice'));P.innerHTML='';voices.forEach(v=>{const it=document.createElement('div');it.className='sel-item'+(v===activeVoice?' active':'');it.dataset.name=v;it.innerHTML=`<div class="sel-item-ic">🎤</div><div class="sel-item-bd"><div class="sel-item-nm">${esc(v)}</div></div><div class="sel-item-ck">✓</div>`;it.addEventListener('click',ev=>{ev.stopPropagation();closeSel();switchVoice(v)});P.appendChild(it)})}
function setActiveVoice(n){activeVoice=n;voiceCur.textContent=n||'—';const vp=_panels.get($('sel-voice'));if(vp)vp.querySelectorAll('.sel-item').forEach(el=>el.classList.toggle('active',el.dataset.name===n))}
async function switchVoice(n){if(n===activeVoice)return;try{const r=await fetch('/api/voice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});if(r.ok){setActiveVoice(n);showToast('Voce: '+n)}}catch(e){console.warn(e)}}
async function loadVoices(rt=5){try{const r=await fetch('/api/voices');const d=await r.json();if(d.voices&&d.voices.length){voices=d.voices;if(d.active)setActiveVoice(d.active);renderVoices()}else if(rt>0)setTimeout(()=>loadVoices(rt-1),2000)}catch(e){if(rt>0)setTimeout(()=>loadVoices(rt-1),2000)}}
$('sel-voice').addEventListener('click',e=>{e.stopPropagation();if(!ttsEnabled){showToast('Attiva la voce per cambiarla');return}toggleSel($('sel-voice'))});

/* TTS on/off — la chat testuale resta attiva in ogni caso */
function setTTS(on){
  ttsEnabled=!!on;
  const b=$('sel-tts');
  b.classList.toggle('tts-off',!ttsEnabled);
  b.title='Voce assistente: '+(ttsEnabled?'attiva':'disattivata (solo testo)');
  // Selettore voce disabilitato quando il TTS è spento
  $('sel-voice').classList.toggle('is-disabled',!ttsEnabled);
  if(!ttsEnabled)closeSel();
}
async function toggleTTS(){
  const next=!ttsEnabled;
  try{
    const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:next})});
    if(r.ok){setTTS(next);showToast(next?'Voce attivata':'Voce disattivata — solo testo')}
  }catch(e){console.warn(e)}
}
$('sel-tts').addEventListener('click',e=>{e.stopPropagation();toggleTTS()});

/* PTT */
function setPTT(k){const d=k.toUpperCase().replace('_L','←').replace('_R','→');pttCur.textContent=d}
function mapKey(e){const m={' ':'space','F1':'f1','F2':'f2','F3':'f3','F4':'f4','F5':'f5','F6':'f6','F7':'f7','F8':'f8','F9':'f9','F10':'f10','F11':'f11','F12':'f12','Control':'ctrl_l','Shift':'shift_l','Alt':'alt_l','CapsLock':'caps_lock','Tab':'tab','Insert':'insert','ScrollLock':'scroll_lock','Pause':'pause','NumLock':'num_lock'};return m[e.key]||(e.key.length===1?e.key.toLowerCase():null)}
function startCap(){capPTT=true;imic.classList.add('cap');pttCur.textContent='premi un tasto…';const ok=e=>{e.preventDefault();e.stopPropagation();const r=mapKey(e);if(!r)return;capPTT=false;imic.classList.remove('cap');document.removeEventListener('keydown',ok,true);setPTT(r);fetch('/api/ptt-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:r})}).catch(()=>{});showToast('PTT → '+r.toUpperCase())};document.addEventListener('keydown',ok,true);const cx=()=>{if(!capPTT)return;capPTT=false;imic.classList.remove('cap');document.removeEventListener('keydown',ok,true)};setTimeout(()=>document.addEventListener('click',cx,{once:true}),50)}
imic.addEventListener('click',e=>{e.stopPropagation();if(!capPTT)startCap()});
$('sel-ptt').addEventListener('click',e=>{e.stopPropagation();if(!capPTT)startCap()});

/* Chat */
function hideEmpty(){if(emptyEl)emptyEl.style.display='none'}
function addUser(t){hideEmpty();finalAsst();hist.push({role:'user',text:t,ts:Date.now()});const r=document.createElement('div');r.className='mrow u';const sp=document.createElement('span');sp.className='mbody-txt';sp.textContent=t;const bd=document.createElement('div');bd.className='mbubble';bd.appendChild(sp);const tm=document.createElement('div');tm.className='mtime';tm.innerHTML=`<span class="mtick">✓✓</span><span>${now()}</span>`;const w=document.createElement('div');w.className='mwrap';w.appendChild(bd);w.appendChild(tm);const av=document.createElement('div');av.className='mav';av.textContent='👤';r.appendChild(w);r.appendChild(av);msgs.appendChild(r);scrollBot()}
function startAsst(){hideEmpty();finalAsst();const r=document.createElement('div');r.className='mrow a streaming';const av=document.createElement('div');av.className='mav';av.textContent='◈';const sp=document.createElement('span');sp.className='mbody-txt';const cb=document.createElement('button');cb.className='copy-btn';cb.textContent='⎘';cb.title='Copia';cb.addEventListener('click',ev=>{ev.stopPropagation();const tx=r.querySelector('.mbody-txt').textContent;function fb(){const ta=document.createElement('textarea');ta.value=tx;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);cb.textContent='✓';cb.classList.add('ok');setTimeout(()=>{cb.textContent='⎘';cb.classList.remove('ok')},1400)}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(()=>{cb.textContent='✓';cb.classList.add('ok');setTimeout(()=>{cb.textContent='⎘';cb.classList.remove('ok')},1400)}).catch(fb)}else fb()});const bd=document.createElement('div');bd.className='mbubble';bd.appendChild(sp);bd.appendChild(cb);const tm=document.createElement('div');tm.className='mtime';tm.innerHTML=`<span>${now()}</span>`;const w=document.createElement('div');w.className='mwrap';w.appendChild(bd);w.appendChild(tm);r.appendChild(av);r.appendChild(w);msgs.appendChild(r);curRow=r;streamTxt='';scrollBot()}
function appendChunk(c){if(genStopped)return;if(!curRow)startAsst();streamTxt+=c;curRow.querySelector('.mbody-txt').textContent=streamTxt;scrollBot()}
function finalAsst(lat){if(curRow){curRow.classList.remove('streaming');hist.push({role:'asst',text:streamTxt,ts:Date.now()});if(lat?.total_ms){const tm=curRow.querySelector('.mtime');if(tm)tm.innerHTML=`<span>${now()} · ${ms2s(lat.total_ms)}</span>`}curRow=null;streamTxt=''}}

/* New session */
/* ── Multi-session management ─────────────────────────────────── */
let sessions=[],activeSession=null;
const sessList=$('sessions-list');

function clearChatArea(placeholder){
  msgs.innerHTML='';
  const e=document.createElement('div');e.className='empty';e.id='empty';
  e.innerHTML=`<div class="empty-ic">◈</div><div class="empty-tx">${placeholder}</div>`;
  msgs.appendChild(e);
  hist.length=0;curRow=null;streamTxt='';
}

function renderMessages(messages){
  msgs.innerHTML='';
  if(!messages||!messages.length){
    clearChatArea('Nessun messaggio<br>Parla o scrivi per iniziare');
    return;
  }
  hist.length=0;
  messages.forEach(m=>{
    if(m.role==='user'){addUser(m.text);}
    else{
      startAsst();
      curRow.querySelector('.mbody-txt').textContent=m.text;
      streamTxt=m.text;
      finalAsst();
    }
  });
}

function renderSessions(){
  sessList.innerHTML='';
  sessions.forEach(s=>{
    const it=document.createElement('div');
    it.className='sess-item'+(s.active?' on':'');
    it.dataset.id=s.id;
    const time=s.last_active?new Date(s.last_active*1000).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'';
    it.innerHTML=`
      <div class="sess-ic">◈<div class="sess-ic-dot"></div></div>
      <div class="sess-bd">
        <div class="sess-tp">
          <span class="sess-nm">${esc(s.name)}</span>
        </div>
        <div class="sess-bt">
          <span class="sess-pv">${s.preview?esc(s.preview):(s.count?s.count+' messaggi':'vuota')}</span>
          <span class="sess-ct">${time}</span>
        </div>
      </div>
      <div class="sess-acts">
        <button class="sess-act sess-ren" title="Rinomina">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        </button>
        ${sessions.length>1?'<button class="sess-act sess-del" title="Elimina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>':''}
      </div>`;
    it.addEventListener('click',ev=>{
      if(ev.target.closest('.sess-ren')){
        ev.stopPropagation();startRename(it,s);return;
      }
      if(ev.target.closest('.sess-del')){
        ev.stopPropagation();delSession(s.id);return;
      }
      if(ev.target.closest('.sess-rename-input'))return;
      if(!s.active)switchSession(s.id);
    });
    sessList.appendChild(it);
  });
}

function startRename(itemEl,s){
  const nameEl=itemEl.querySelector('.sess-nm');
  if(!nameEl||itemEl.querySelector('.sess-rename-input'))return;
  const inp=document.createElement('input');
  inp.className='sess-rename-input';
  inp.value=s.name;
  inp.maxLength=40;
  nameEl.style.display='none';
  nameEl.parentNode.insertBefore(inp,nameEl);
  inp.focus();inp.select();
  let done=false;
  const finish=async(save)=>{
    if(done)return;done=true;
    const nv=inp.value.trim();
    inp.remove();nameEl.style.display='';
    if(save&&nv&&nv!==s.name){
      try{
        const r=await fetch('/api/sessions/rename',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id:s.id,name:nv})});
        const d=await r.json();
        if(d.ok){sessions=d.sessions;renderSessions();showToast('Chat rinominata')}
      }catch(e){console.warn(e)}
    }
  };
  inp.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Enter'){e.preventDefault();finish(true)}
    else if(e.key==='Escape'){e.preventDefault();finish(false)}
  });
  inp.addEventListener('click',e=>e.stopPropagation());
  inp.addEventListener('blur',()=>finish(true));
}

async function newSess(){
  try{
    const r=await fetch('/api/sessions/new',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({name:''})});
    const d=await r.json();
    if(d.ok){
      sessions=d.sessions;activeSession=d.id;
      renderSessions();
      clearChatArea('Nuova chat<br>Parla o scrivi per iniziare');
      updStats({turns:0,words_in:0,words_out:0,stt_errors:0,tts_errors:0});
      showToast('Nuova chat creata');
    }
  }catch(e){console.warn(e)}
}

async function switchSession(id){
  try{
    const r=await fetch('/api/sessions/switch',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    const d=await r.json();
    if(d.ok){
      activeSession=id;sessions=d.sessions;
      renderSessions();
      renderMessages(d.messages);
      showToast('Chat aperta');
    }
  }catch(e){console.warn(e)}
}

async function delSession(id){
  try{
    const r=await fetch('/api/sessions/delete',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    const d=await r.json();
    if(d.ok){
      sessions=d.sessions;
      if(d.active)activeSession=d.active;
      else{const act=sessions.find(s=>s.active);if(act)activeSession=act.id;}
      renderSessions();
      // Mostra i messaggi della nuova chat attiva
      if(d.messages&&d.messages.length){
        renderMessages(d.messages);
      }else{
        clearChatArea('Nessun messaggio<br>Parla o scrivi per iniziare');
      }
      showToast('Chat eliminata');
    }
  }catch(e){console.warn(e)}
}

$('list-add').addEventListener('click',newSess);

/* Export */
async function exportChat(){
  if(!hist.length){showToast('Nessun messaggio da esportare');return}
  const L=['# local-assistant — Chat export','','---',''];
  hist.forEach(m=>{
    const ts=new Date(m.ts).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    L.push('**'+(m.role==='user'?'Tu':'Assistente')+'** · '+ts,'',m.text,'','---','');
  });
  const content=L.join('\n');
  const fname='chat-'+new Date().toISOString().slice(0,10)+'.md';

  // Try File System Access API (lets user pick location)
  if(window.showSaveFilePicker){
    try{
      const handle=await window.showSaveFilePicker({
        suggestedName:fname,
        types:[{description:'Markdown',accept:{'text/markdown':['.md']}},
               {description:'Testo',accept:{'text/plain':['.txt']}}]
      });
      const w=await handle.createWritable();
      await w.write(content);
      await w.close();
      showToast('Chat salvata');
      return;
    }catch(e){
      if(e.name==='AbortError')return; // user cancelled
      console.warn('showSaveFilePicker fallito, uso fallback',e);
    }
  }

  // Fallback: classic download (goes to default Downloads folder)
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:'text/markdown'}));
  a.download=fname;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Chat scaricata in Download');
}
$('hd-more').addEventListener('click',exportChat);

/* Palette */
const CMDS=[{ic:'✦',lb:'Nuova sessione',sb:'Ctrl+N',ac:newSess},{ic:'↓',lb:'Esporta chat',sb:'Ctrl+E',ac:exportChat},{ic:'🌙',lb:'Cambia tema',sb:'T',ac:()=>setTheme(!isDark)},{ic:'🔊',lb:'Voce assistente (on/off)',sb:'',ac:toggleTTS},{ic:'🎙',lb:'Cambia tasto PTT',sb:'',ac:()=>{closePal();startCap()}}];
function buildPal(q=''){const f=q.toLowerCase().trim(),items=[];const c=CMDS.filter(x=>!f||x.lb.toLowerCase().includes(f));if(c.length){items.push({t:'s',lb:'Azioni'});c.forEach(x=>items.push({t:'c',...x}))}const p=personalities.filter(x=>!f||(x.display_name||x.name).toLowerCase().includes(f));if(p.length){items.push({t:'s',lb:'Personalità'});p.forEach((x,i)=>items.push({t:'p',ic:PEM[i%PEM.length],lb:x.display_name||x.name,nm:x.name}))}const m=models.filter(x=>!f||x.toLowerCase().includes(f));if(m.length){items.push({t:'s',lb:'Modelli'});m.forEach(x=>items.push({t:'m',ic:'🧠',lb:x,nm:x}))}const v=voices.filter(x=>!f||x.toLowerCase().includes(f));if(v.length){items.push({t:'s',lb:'Voci'});v.forEach(x=>items.push({t:'v',ic:'🎤',lb:x,nm:x}))}return items}
function renderPal(q=''){palSel=0;const it=buildPal(q);palRs.innerHTML='';let i=0;it.forEach(x=>{if(x.t==='s'){const s=document.createElement('div');s.className='pit-sc';s.textContent=x.lb;palRs.appendChild(s);return}const d=document.createElement('div');d.className='pit'+(i===0?' sel':'');d.innerHTML=`<div class="pit-ic">${x.ic}</div><div class="pit-lb">${esc(x.lb)}</div>${x.sb?`<div class="pit-sb">${esc(x.sb)}</div>`:''}`;d.addEventListener('click',()=>runPal(x));palRs.appendChild(d);i++})}
function runPal(x){closePal();if(x.t==='c')x.ac();else if(x.t==='p')switchPers(x.nm);else if(x.t==='m')switchModel(x.nm);else if(x.t==='v')switchVoice(x.nm)}
function openPal(){palOpen=true;palette.classList.add('open');palIn.value='';renderPal('');palIn.focus()}
function closePal(){palOpen=false;palette.classList.remove('open');itxt.focus()}
palIn.addEventListener('input',e=>renderPal(e.target.value));
palIn.addEventListener('keydown',e=>{const it=palRs.querySelectorAll('.pit');if(!it.length)return;if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,it.length-1)}else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0)}else if(e.key==='Enter'){e.preventDefault();it[palSel]?.click();return}it.forEach((el,j)=>el.classList.toggle('sel',j===palSel));it[palSel]?.scrollIntoView({block:'nearest'})});
palette.addEventListener('click',e=>{if(e.target===palette)closePal()});
$('hd-pal').addEventListener('click',()=>palOpen?closePal():openPal());

/* Hotkeys */
document.addEventListener('keydown',e=>{if(capPTT)return;if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();palOpen?closePal():openPal();return}if(e.key==='Escape'&&palOpen){e.preventDefault();closePal();return}if((e.ctrlKey||e.metaKey)&&e.key==='n'){e.preventDefault();newSess();return}if((e.ctrlKey||e.metaKey)&&e.key==='e'){e.preventDefault();exportChat();return}if(e.key==='t'&&!e.ctrlKey&&!e.metaKey&&document.activeElement!==itxt&&document.activeElement!==palIn)setTheme(!isDark)});

/* ── Upload allegati per file_analysis ─────────────────────────────────── */
const MAX_ATTACHMENTS = 3;
const ALLOWED_EXTS = [
  '.pdf','.docx','.txt','.md','.log','.rst','.yaml','.yml',
  '.html','.htm','.json','.csv','.tsv','.xml',
  '.wav','.mp3','.ogg','.flac','.m4a','.opus',
];
const iattach = $('iattach');
const ifile   = $('ifile');
const attachRow = $('attach-row');
const dropOv  = $('drop-ov');
let attachments = [];   // [{path, name, size, ext}]

function fmtBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
}

function iconForExt(ext){
  if(['.pdf','.docx','.txt','.md','.log','.rst','.yaml','.yml','.html','.htm'].includes(ext)) return '📄';
  if(['.json','.xml'].includes(ext)) return '🔧';
  if(['.csv','.tsv'].includes(ext)) return '📊';
  if(['.wav','.mp3','.ogg','.flac','.m4a','.opus'].includes(ext)) return '🎵';
  return '📎';
}

function renderAttachments(){
  attachRow.innerHTML = '';
  if(attachments.length === 0){
    attachRow.classList.remove('on');
    return;
  }
  attachRow.classList.add('on');
  attachments.forEach((a, i) => {
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    chip.innerHTML = `
      <span class="attach-chip-ic">${iconForExt(a.ext)}</span>
      <span class="attach-chip-nm" title="${esc(a.path)}">${esc(a.name)}</span>
      <span class="attach-chip-sz">${fmtBytes(a.size)}</span>
      <button class="attach-chip-rm" data-idx="${i}" title="Rimuovi">×</button>
    `;
    chip.querySelector('.attach-chip-rm').addEventListener('click', e => {
      const idx = parseInt(e.currentTarget.dataset.idx, 10);
      attachments.splice(idx, 1);
      renderAttachments();
    });
    attachRow.appendChild(chip);
  });
}

async function uploadFile(file){
  // Pre-check estensione (UX rapida, il server controlla comunque)
  const lastDot = file.name.lastIndexOf('.');
  const ext = lastDot < 0 ? '' : file.name.slice(lastDot).toLowerCase();
  if(!ALLOWED_EXTS.includes(ext)){
    showToast(`Estensione ${ext || 'sconosciuta'} non supportata`, 3500);
    return null;
  }
  // Limite numerico
  if(attachments.length >= MAX_ATTACHMENTS){
    showToast(`Massimo ${MAX_ATTACHMENTS} file per messaggio`, 2500);
    return null;
  }

  iattach.classList.add('busy');
  try{
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch('/api/uploads', {method: 'POST', body: fd});
    if(!r.ok){
      let msg = `Upload fallito (HTTP ${r.status})`;
      try{ const j = await r.json(); if(j.detail) msg = j.detail; }catch{}
      showToast(msg, 4000);
      return null;
    }
    const j = await r.json();
    if(!j.ok){
      showToast(j.error || 'Upload fallito', 3500);
      return null;
    }
    return j;   // {ok, path, name, size, ext}
  }catch(e){
    console.warn('upload failed', e);
    showToast('Upload fallito: ' + e.message, 4000);
    return null;
  }finally{
    iattach.classList.remove('busy');
  }
}

async function handleFiles(fileList){
  const files = Array.from(fileList || []);
  if(files.length === 0) return;
  // Caricamento seriale per non saturare e per messaggi d'errore distinti
  for(const f of files){
    if(attachments.length >= MAX_ATTACHMENTS){
      showToast(`Massimo ${MAX_ATTACHMENTS} file per messaggio`, 2500);
      break;
    }
    const result = await uploadFile(f);
    if(result){
      attachments.push(result);
      renderAttachments();
    }
  }
  itxt.focus();
}

iattach.addEventListener('click', () => ifile.click());
ifile.addEventListener('change', e => {
  handleFiles(e.target.files);
  e.target.value = '';   // permette di re-selezionare lo stesso file
});

/* Drag & drop sulla finestra */
let dragDepth = 0;
window.addEventListener('dragenter', e => {
  if(!e.dataTransfer || !e.dataTransfer.types.includes('Files')) return;
  e.preventDefault();
  dragDepth++;
  dropOv.classList.add('on');
});
window.addEventListener('dragover', e => {
  if(!e.dataTransfer || !e.dataTransfer.types.includes('Files')) return;
  e.preventDefault();
});
window.addEventListener('dragleave', e => {
  if(!e.dataTransfer) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if(dragDepth === 0) dropOv.classList.remove('on');
});
window.addEventListener('drop', e => {
  if(!e.dataTransfer) return;
  e.preventDefault();
  dragDepth = 0;
  dropOv.classList.remove('on');
  if(e.dataTransfer.files && e.dataTransfer.files.length){
    handleFiles(e.dataTransfer.files);
  }
});

/* Send */
async function sendMsg(){
  const t = itxt.value.trim();
  // Invio "solo allegati" permesso (es. trascina un PDF e invia)
  if(!t && attachments.length === 0) return;

  // Compone il payload finale: testo + path degli allegati.
  // L'orchestrator riconosce i path assoluti tramite _FILE_PATH_RE.
  let payload = t;
  if(attachments.length > 0){
    const lines = attachments.map(a => `[Allegato: ${a.path}]`);
    payload = (t ? t + '\n\n' : '') + lines.join('\n');
  }

  itxt.value = '';
  autoR();
  attachments = [];
  renderAttachments();

  isend.disabled = true;
  try{
    await fetch('/api/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: payload}),
    });
  }catch(e){
    console.warn(e);
    showToast('Invio fallito: ' + e.message, 3500);
  }finally{
    isend.disabled = false;
    itxt.focus();
  }
}
itxt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
isend.addEventListener('click',sendMsg);
itxt.addEventListener('input',autoR);

/* Cancel — interrompe la generazione in corso */
const istop=$('istop');
let cancelling=false;
function isGenerating(){
  const s=document.body.dataset.state;
  return s==='thinking'||s==='speaking';
}
async function cancelGen(){
  if(cancelling||!isGenerating())return;
  cancelling=true;
  // Da subito: ignora i chunk ancora in transito mentre il backend si ferma.
  genStopped=true;
  istop.style.opacity='.6';
  // Segnala visivamente l'interruzione nel messaggio in streaming
  if(curRow){
    curRow.classList.remove('streaming');
    const tm=curRow.querySelector('.mtime');
    if(tm)tm.innerHTML=`<span>${now()} · interrotto</span>`;
  }
  try{
    const r=await fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    if(!r.ok&&r.status===404){
      // Fallback per backend con endpoint diverso
      await fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).catch(()=>{});
    }
    showToast('Risposta interrotta');
  }catch(e){
    console.warn('cancel failed',e);
    showToast('Impossibile interrompere',2500);
  }finally{
    cancelling=false;
    istop.style.opacity='';
    // Lo stato torna a 'idle' quando il server emette il prossimo messaggio 'state'.
    // Se non arriva nulla entro 1s assumiamo che sia stato interrotto e forziamo idle lato UI.
    setTimeout(()=>{if(isGenerating()&&curRow===null)applyState('idle')},1000);
    finalAsst();
  }
}
istop.addEventListener('click',cancelGen);
// Esc interrompe la generazione (se non c'è la palette aperta e non si sta catturando il PTT)
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(palOpen||capPTT)return;
  if(isGenerating()){e.preventDefault();cancelGen()}
},true);

/* WS */
function connect(){
  clearTimeout(reconn);
  // Evita l'accumulo di ping: connect() viene richiamata a ogni riconnessione
  // (onclose → setTimeout), quindi senza questo clear ogni ricollegamento
  // lascerebbe attivo un setInterval in più che continua a inviare 'ping'.
  clearInterval(pingTimer);
  const pr=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${pr}://${location.host}/ws`);
  ws.onopen=()=>{$('rb-conn').style.color='#30d158'};
  ws.onclose=()=>{$('rb-conn').style.color='var(--t4)';applyState('idle');reconn=setTimeout(connect,2000)};
  ws.onerror=()=>ws.close();
  ws.onmessage=({data})=>{
    let m;try{m=JSON.parse(data)}catch{return}
    switch(m.type){
      case 'init':
        applyState(m.state||'idle');
        if(m.ptt_key)setPTT(m.ptt_key);
        if(m.session)activeSession=m.session;
        if(m.sessions){sessions=m.sessions;renderSessions()}
        if(m.personalities){personalities=m.personalities;renderPers()}
        if(m.personality)setActivePers(m.personality);
        if(m.model)setActiveModel(m.model);
        if(m.voices){voices=m.voices;renderVoices()}
        if(m.voice)setActiveVoice(m.voice);
        if(m.tts_enabled!=null)setTTS(m.tts_enabled);
        if(m.stats)updStats(m.stats);
        // Renderizza subito i messaggi della sessione attiva
        if(m.active_messages&&m.active_messages.length){
          renderMessages(m.active_messages);
        }
        loadModels();loadVoices();
        break;
      case 'state':
        applyState(m.value);
        // Nuovo turno in elaborazione: riabilita la ricezione dei chunk.
        if(m.value==='thinking'){genStopped=false;if(!curRow)startAsst();}
        if(m.value==='listening')finalAsst();
        break;
      case 'user':genStopped=false;addUser(m.text);break;
      case 'chunk':appendChunk(m.text);break;
      case 'stats':updStats(m);if(m.latency)updLat(m.latency);break;
      case 'latency':updLat(m);finalAsst(m);break;
      case 'personality':setActivePers(m.name);break;
      case 'model':setActiveModel(m.name);break;
      case 'voice':if(m.name)setActiveVoice(m.name);break;
      case 'tts':if(m.enabled!=null)setTTS(m.enabled);break;
      case 'mode':
        // Il backend è passato a terminale (es. da un altro client o
        // ripristino): segui il cambio. Simmetrico al case 'mode' di
        // terminal.html, che riporta a /chat. Evita di restare disallineati
        // con la modalità reale del loop.
        if(m.mode==='terminal')window.location='/terminal';
        break;
      case 'ptt_key':if(m.key)setPTT(m.key);break;
      case 'sessions':if(m.sessions){sessions=m.sessions;renderSessions()}break;
      case 'session_switch':
        if(m.sessions){sessions=m.sessions;renderSessions()}
        if(m.id)activeSession=m.id;
        if(m.messages)renderMessages(m.messages);
        break;
    }
  };
  pingTimer=setInterval(()=>{if(ws.readyState===WebSocket.OPEN)ws.send('ping')},20000);
}
connect();
itxt.focus();
</script>
